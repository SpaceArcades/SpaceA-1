
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Arcade</title>
  <link id="favicon" rel="icon" type="image/png"
    href="https://a.favicon.im/www.magma.se?larger=true">

  <style>
    :root {
      --bg: #030305;
      --panel: rgba(10, 10, 15, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --panel-hover: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.25);
      --neon-glow: 0 0 15px rgba(255, 255, 255, 0.18);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(0, 0, 0, 0.15);
      --panel-hover: rgba(0, 0, 0, 0.04);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0f172a;
      --accent-glow: rgba(15, 23, 42, 0.25);
      --neon-glow: 0 0 15px rgba(15, 23, 42, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color .4s, color .4s;
    }

    #spaceCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
    }

    .wordmark {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.02em;
      text-transform: uppercase;
    }

    .wordmark span {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .music-player {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(0,0,0,.2);
    }

    .play-btn, .mute-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #000;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: .7rem;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,.3);
      transition: transform .2s, box-shadow .2s;
    }

    [data-theme="light"] .play-btn,
    [data-theme="light"] .mute-btn {
      background: #0f172a;
      color: #fff;
    }

    .play-btn:hover, .mute-btn:hover {
      transform: scale(1.08);
      box-shadow: var(--neon-glow);
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 120px;
    }

    .track-title {
      font-size: .68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-bar, .volume-bar {
      width: 100%;
      height: 4px;
      appearance: none;
      background: rgba(255,255,255,.15);
      border-radius: 2px;
      cursor: pointer;
    }

    [data-theme="light"] .progress-bar,
    [data-theme="light"] .volume-bar {
      background: rgba(0,0,0,.15);
    }

    .progress-bar::-webkit-slider-thumb,
    .volume-bar::-webkit-slider-thumb {
      appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text);
    }

    .vol-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .volume-bar {
      width: 45px;
    }

    .hero {
      padding: 36px 0 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 6px;
      text-shadow: var(--neon-glow);
    }

    .hero p {
      color: var(--muted);
      font-size: .95rem;
    }

    .aesthetic-banner {
      margin-top: 24px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(12px);
      box-shadow: var(--neon-glow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 5px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      width: fit-content;
      backdrop-filter: blur(10px);
    }

    .tab {
      color: var(--muted);
      border-radius: 6px;
      padding: 8px 18px;
      font-size: .85rem;
      font-weight: 600;
      background: transparent;
      transition: all .2s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: #fff;
      background: #000;
      border: 1px solid rgba(255,255,255,.3);
      font-weight: 700;
      box-shadow: var(--neon-glow);
    }

    [data-theme="light"] .tab.active {
      background: #0f172a;
      color: #fff;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin: 28px 0 16px;
      gap: 16px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sub {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 2px;
    }

    .count {
      color: var(--muted);
      font-size: .78rem;
      border: 1px solid var(--panel-border);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      background: var(--panel);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .app-card {
      text-align: left;
      position: relative;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      background: var(--panel);
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }

    .app-card:hover {
      border-color: var(--accent);
      background: var(--panel-hover);
      transform: translateY(-4px);
      box-shadow: var(--neon-glow);
    }

    .app-card.selected {
      border-color: var(--accent);
      box-shadow: var(--neon-glow);
    }

    .app-card.selected::after {
      content: "ACTIVE";
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: .58rem;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--text);
      background: var(--panel-border);
      padding: 3px 6px;
      border-radius: 4px;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-md);
      background: rgba(0,0,0,.2);
      border: 1px solid var(--panel-border);
      margin-bottom: 12px;
      overflow: hidden;
    }

    [data-theme="light"] .app-icon {
      background: rgba(0,0,0,.04);
    }

    .app-icon img, .preview-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .app-name {
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .app-desc {
      color: var(--muted);
      font-size: .8rem;
    }

    .edit-layout {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
      margin-top: 16px;
    }

    .panel {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .panel h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .panel p {
      color: var(--muted);
      font-size: .85rem;
    }

    .field-label {
      display: block;
      margin: 18px 0 6px;
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      background: rgba(0,0,0,.3);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .9rem;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }

    [data-theme="light"] input[type="text"] {
      background: rgba(0,0,0,.03);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: var(--neon-glow);
    }

    .primary-btn, .game-back-btn, .game-fullscreen-btn {
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: .85rem;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.3);
      white-space: nowrap;
      transition: transform .2s, box-shadow .2s;
    }

    [data-theme="light"] .primary-btn,
    [data-theme="light"] .game-back-btn,
    [data-theme="light"] .game-fullscreen-btn {
      background: #0f172a;
    }

    .primary-btn:hover, .game-back-btn:hover,
    .game-fullscreen-btn:hover {
      transform: scale(1.02);
      box-shadow: var(--neon-glow);
    }

    .preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: rgba(0,0,0,.2);
      border: 1px solid var(--panel-border);
    }

    [data-theme="light"] .preview-row {
      background: rgba(0,0,0,.03);
    }

    .preview-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.3);
      flex-shrink: 0;
    }

    .preview-meta strong {
      display: block;
      font-size: .88rem;
      font-weight: 700;
    }

    .preview-meta span {
      display: block;
      color: var(--muted);
      font-size: .75rem;
      margin-top: 1px;
    }

    .status {
      color: var(--text);
      font-size: .8rem;
      min-height: 1.2em;
      margin-top: 10px;
    }

    .games-catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }

    .game-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      text-align: left;
      backdrop-filter: blur(10px);
      transition: transform .3s, border-color .3s, box-shadow .3s;
      width: 100%;
      padding: 0;
    }

    .game-card:hover {
      border-color: var(--accent);
      transform: translateY(-6px);
      box-shadow: var(--neon-glow);
    }

    .game-thumbnail {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: rgba(0,0,0,.4);
      display: block;
    }

    .game-card-body {
      padding: 18px;
    }

    .game-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .game-card p {
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.4;
    }

    .game-player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .game-player-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .game-player-frame {
      position: relative;
      width: 100%;
      height: clamp(500px, 65vh, 720px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      background: #000;
      box-shadow: var(--neon-glow);
    }

    .game-player-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .coming-soon-message {
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 800;
      background: #000;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 768px) {
      .app-grid, .edit-layout {
        grid-template-columns: 1fr;
      }

      .aesthetic-banner {
        flex-direction: column;
        align-items: flex-start;
      }

      header {
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }

      .game-player-top {
        align-items: stretch;
      }

      .game-player-title {
        width: 100%;
      }

      .music-player {
        max-width: 100%;
        gap: 7px;
        padding: 6px 9px;
      }

      .player-controls {
        width: 90px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="spaceCanvas" aria-hidden="true"></canvas>

  <div class="shell">
    <header>
      <div class="wordmark">SPACE <span>ARCADE</span></div>

      <div class="header-controls">
        <div class="music-player">
          <button class="play-btn" id="playBtn"
            type="button" aria-label="Play music">▶</button>

          <div class="player-controls">
            <span class="track-title">Chill Hop Space</span>
            <input type="range" class="progress-bar" id="progressBar"
              value="0" min="0" max="100" aria-label="Music progress">
          </div>

          <button class="mute-btn" id="muteBtn" type="button"
            title="Mute/Unmute" aria-label="Mute music">🔊</button>

          <div class="vol-container">
            <input type="range" class="volume-bar" id="volumeBar"
              value="80" min="0" max="100" aria-label="Music volume">
          </div>

          <audio id="audioPlayer"
            src="zephiramusic-chill-hop-603159.mp3"
            preload="metadata" loop></audio>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="aesthetic-banner">
          <nav class="tabs" aria-label="Main sections">
            <button class="tab active" id="editTab" type="button"
              aria-selected="true">Shortcuts</button>
            <button class="tab" id="gamesTab" type="button"
              aria-selected="false">Arcade</button>
          </nav>
        </div>
      </section>

      <!-- SHORTCUTS SECTION -->
      <section id="editSection">
        <div class="section-heading">
          <div>
            <h2>Select Shortcut</h2>
            <p class="sub">Choose an app to edit browser tab title and favicon.</p>
          </div>
          <span class="count">3 apps</span>
        </div>

        <div class="app-grid" id="appGrid">
          <button class="app-card selected" type="button"
            data-id="magma" aria-pressed="true">
            <div class="app-icon">
              <img src="https://a.favicon.im/www.magma.se?larger=true"
                alt="Magma">
            </div>
            <div>
              <div class="app-name" data-name="magma">Magma</div>
              <div class="app-desc">Magma app shortcut</div>
            </div>
          </button>

          <button class="app-card" type="button"
            data-id="docs" aria-pressed="false">
            <div class="app-icon">
              <img src="https://www.google.com/s2/favicons?domain=docs.google.com&sz=128"
                alt="Google Docs">
            </div>
            <div>
              <div class="app-name" data-name="docs">Docs</div>
              <div class="app-desc">Google Docs shortcut</div>
            </div>
          </button>

          <button class="app-card" type="button"
            data-id="classroom" aria-pressed="false">
            <div class="app-icon">
              <img src="https://www.google.com/s2/favicons?domain=classroom.google.com&sz=128"
                alt="Classroom">
            </div>
            <div>
              <div class="app-name" data-name="classroom">Classroom</div>
              <div class="app-desc">Google Classroom</div>
            </div>
          </button>
        </div>

        <div class="edit-layout">
          <section class="panel">
            <h3>Edit Display Name</h3>
            <p>Customize the active tab name.</p>

            <label class="field-label" for="appName">Display name</label>
            <div class="input-row">
              <input id="appName" type="text" maxlength="48" value="Magma">
              <button class="primary-btn" id="saveBtn" type="button">
                Save
              </button>
            </div>

            <div class="status" id="status" role="status"
              aria-live="polite"></div>
          </section>

          <aside class="panel">
            <h3>Tab Preview</h3>
            <p>Appearance in browser tab.</p>

            <div class="preview-row">
              <div class="preview-icon" id="previewIcon">
                <img
                  src="https://a.favicon.im/www.magma.se?larger=true"
                  alt="">
              </div>
              <div class="preview-meta">
                <strong id="previewName">Magma</strong>
                <span id="previewSub">Space Arcade · Browser tab</span>
              </div>
            </div>
          </aside>
        </div>
      </section>

      <!-- ARCADE SECTION -->
      <section id="gamesSection" class="hidden">
        <div id="gamesCatalogView">
          <div class="section-heading">
            <div>
              <h2>Featured Arcade</h2>
              <p class="sub">Select a game to play.</p>
            </div>
            <span class="count">5 games</span>
          </div>

          <div class="games-catalog">
            <button class="game-card" type="button" id="slopeGameCard">
              <img class="game-thumbnail" src="slope.png"
                alt="Slope" onerror="this.style.display='none'">
              <div class="game-card-body">
                <h3>Slope</h3>
                <p>Race down a fast-paced 3D slope.</p>
              </div>
            </button>

            <button class="game-card" type="button" id="spaceWavesGameCard">
              <img class="game-thumbnail" src="sp.png"
                alt="Space Waves" onerror="this.style.display='none'">
              <div class="game-card-body">
                <h3>Space Waves</h3>
                <p>Dodge obstacles in space.</p>
              </div>
            </button>

            <button class="game-card" type="button" id="minecraftGameCard">
              <img class="game-thumbnail" src="mc.png"
                alt="Minecraft" onerror="this.style.display='none'">
              <div class="game-card-body">
                <h3>Minecraft</h3>
                <p>Coming soon.</p>
              </div>
            </button>

            <button class="game-card" type="button" id="amongUsGameCard">
              <img class="game-thumbnail" src="Am.png"
                alt="Among Us" onerror="this.style.display='none'">
              <div class="game-card-body">
                <h3>Among Us</h3>
                <p>Open Among Us in the arcade.</p>
              </div>
            </button>

            <button class="game-card" type="button" id="grannyGameCard">
              <img class="game-thumbnail" src="granny.png"
                alt="Granny" onerror="this.style.display='none'">
              <div class="game-card-body">
                <h3>Granny</h3>
                <p>Try to escape the house.</p>
              </div>
            </button>
          </div>
        </div>

        <!-- GAME PLAYER -->
        <div id="gamePlayerView" class="hidden">
          <div class="game-player-top">
            <button class="game-back-btn" id="gameBackBtn" type="button">
              ← Back to Catalog
            </button>

            <div class="game-player-title" id="gamePlayerTitle">
              Game Title
            </div>

            <button class="game-fullscreen-btn" id="gameOpenTabBtn"
              type="button">Open in new tab ↗</button>

            <button class="game-fullscreen-btn" id="gameFullscreenBtn"
              type="button">Fullscreen ⛶</button>
          </div>

          <div class="game-player-frame" id="gamePlayerFrame"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    /* STARFIELD AND SHOOTING STARS */
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor(
        (window.innerWidth * window.innerHeight) / 3000
      );

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          size: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.2 + 0.05
        });
      }
    }

    function createShootingStar() {
      if (shootingStars.length < 3 && Math.random() < 0.02) {
        shootingStars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight / 2),
          length: Math.random() * 80 + 40,
          speed: Math.random() * 10 + 6,
          angle: Math.PI / 4,
          alpha: 1
        });
      }
    }

    function animateSpace() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const isLight =
        document.body.getAttribute("data-theme") === "light";

      ctx.fillStyle = isLight ? "#0f172a" : "#ffffff";

      stars.forEach(star => {
        star.y -= star.speed;
        if (star.y < 0) star.y = window.innerHeight;

        ctx.globalAlpha = star.alpha * (isLight ? 0.2 : 0.8);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      createShootingStar();

      shootingStars.forEach((star, index) => {
        ctx.strokeStyle = isLight
          ? `rgba(15, 23, 42, ${star.alpha})`
          : `rgba(255, 255, 255, ${star.alpha})`;

        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(
          star.x - Math.cos(star.angle) * star.length,
          star.y - Math.sin(star.angle) * star.length
        );
        ctx.stroke();

        star.x += Math.cos(star.angle) * star.speed;
        star.y += Math.sin(star.angle) * star.speed;
        star.alpha -= 0.015;

        if (star.alpha <= 0) {
          shootingStars.splice(index, 1);
        }
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(animateSpace);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    animateSpace();

    /* MUSIC PLAYER */
    const audio = document.getElementById("audioPlayer");
    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const progressBar = document.getElementById("progressBar");
    const volumeBar = document.getElementById("volumeBar");

    let userWantsMusic = false;
    audio.volume = 0.8;

    function updatePlayButton(isPlaying) {
      playBtn.textContent = isPlaying ? "❚❚" : "▶";
      playBtn.setAttribute(
        "aria-label",
        isPlaying ? "Pause music" : "Play music"
      );
    }

    async function playMusic() {
      try {
        await audio.play();
        updatePlayButton(true);
      } catch (error) {
        userWantsMusic = false;
        updatePlayButton(false);
        document.getElementById("status").textContent =
          "Music could not be played. Check that the audio file exists.";
      }
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        userWantsMusic = true;
        playMusic();
      } else {
        userWantsMusic = false;
        audio.pause();
        updatePlayButton(false);
      }
    });

    muteBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;

      muteBtn.textContent = audio.muted ? "🔇" : "🔊";
      muteBtn.setAttribute(
        "aria-label",
        audio.muted ? "Unmute music" : "Mute music"
      );

      volumeBar.value = audio.muted ? 0 : audio.volume * 100;
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progressBar.value =
          (audio.currentTime / audio.duration) * 100;
      }
    });

    progressBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime =
          (Number(progressBar.value) / 100) * audio.duration;
      }
    });

    volumeBar.addEventListener("input", () => {
      audio.volume = Number(volumeBar.value) / 100;
      audio.muted = audio.volume === 0;

      muteBtn.textContent = audio.muted ? "🔇" : "🔊";
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        audio.pause();
        updatePlayButton(false);
      } else if (
        userWantsMusic &&
        gamePlayerView.classList.contains("hidden")
      ) {
        playMusic();
      }
    });

    /* SHORTCUT AND FAVICON MANAGER */
    const apps = {
      magma: {
        id: "magma",
        name: "Magma",
        icon: "https://a.favicon.im/www.magma.se?larger=true"
      },
      docs: {
        id: "docs",
        name: "Docs",
        icon: "https://www.google.com/s2/favicons?domain=docs.google.com&sz=128"
      },
      classroom: {
        id: "classroom",
        name: "Classroom",
        icon: "https://www.google.com/s2/favicons?domain=classroom.google.com&sz=128"
      }
    };

    const appNameInput = document.getElementById("appName");
    const faviconLink = document.getElementById("favicon");
    const status = document.getElementById("status");

    let selectedId = "magma";

    function selectApp(id) {
      if (!apps[id]) return;

      selectedId = id;
      const app = apps[id];

      appNameInput.value = app.name;

      document.querySelectorAll(".app-card").forEach(card => {
        const selected = card.dataset.id === id;
        card.classList.toggle("selected", selected);
        card.setAttribute("aria-pressed", String(selected));
      });

      document.querySelector("#previewIcon img").src = app.icon;
      faviconLink.href = app.icon;
      document.getElementById("previewName").textContent = app.name;
      status.textContent = "";
    }

    function saveChanges() {
      const newName = appNameInput.value.trim();

      if (!newName) {
        status.textContent = "Please enter a valid display name.";
        return;
      }

      apps[selectedId].name = newName;

      const cardTitle = document.querySelector(
        `[data-id="${selectedId}"] .app-name`
      );

      if (cardTitle) {
        cardTitle.textContent =
          selectedId === "docs" && newName === "Docs"
            ? "Docs"
            : newName;
      }

      document.title = newName;
      document.getElementById("previewName").textContent = newName;
      status.textContent = "Saved successfully!";
    }

    document.querySelectorAll(".app-card").forEach(card => {
      card.addEventListener("click", () => selectApp(card.dataset.id));
    });

    document.getElementById("saveBtn")
      .addEventListener("click", saveChanges);

    appNameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") saveChanges();
    });

    /* SECTION NAVIGATION */
    function showSection(section) {
      const isEdit = section === "edit";

      document.getElementById("editSection")
        .classList.toggle("hidden", !isEdit);

      document.getElementById("gamesSection")
        .classList.toggle("hidden", isEdit);

      document.getElementById("editTab")
        .classList.toggle("active", isEdit);

      document.getElementById("gamesTab")
        .classList.toggle("active", !isEdit);

      document.getElementById("editTab")
        .setAttribute("aria-selected", String(isEdit));

      document.getElementById("gamesTab")
        .setAttribute("aria-selected", String(!isEdit));
    }

    document.getElementById("editTab")
      .addEventListener("click", () => showSection("edit"));

    document.getElementById("gamesTab")
      .addEventListener("click", () => showSection("games"));

    /* GAME CATALOG */
    const games = {
      slope: {
        title: "Slope",
        url: "https://slopesunblocked.io/"
      },
      spaceWaves: {
        title: "Space Waves",
        url: "https://www.crazygames.com/embed/space-waves"
      },
      granny: {
        title: "Granny",
        url: "https://brainworxedu.github.io/play/granny.html"
      },
      amongUs: {
        title: "Among Us",
        url: "https://kiz10.com/embed/among-us-online/"
      }
    };

    const gameCatalogView =
      document.getElementById("gamesCatalogView");

    const gamePlayerView =
      document.getElementById("gamePlayerView");

    const gamePlayerFrame =
      document.getElementById("gamePlayerFrame");

    const gamePlayerTitle =
      document.getElementById("gamePlayerTitle");

    const openTabBtn =
      document.getElementById("gameOpenTabBtn");

    const fullscreenBtn =
      document.getElementById("gameFullscreenBtn");

    let currentGameKey = null;

    function openGame(gameKey) {
      const game = games[gameKey];
      if (!game) return;

      currentGameKey = gameKey;

      // Pause background music while a game is open.
      audio.pause();
      updatePlayButton(false);

      gamePlayerTitle.textContent = game.title;
      openTabBtn.classList.remove("hidden");
      fullscreenBtn.classList.remove("hidden");

      // Remove the previous game to stop it playing in the background.
      gamePlayerFrame.replaceChildren();

      const frame = document.createElement("iframe");
      frame.src = game.url;
      frame.title = game.title;
      frame.allow = "fullscreen; autoplay; gamepad; pointer-lock";
      frame.allowFullscreen = true;
      frame.referrerPolicy = "strict-origin-when-cross-origin";

      gamePlayerFrame.appendChild(frame);

      gameCatalogView.classList.add("hidden");
      gamePlayerView.classList.remove("hidden");
    }

    function openComingSoon() {
      currentGameKey = null;

      audio.pause();
      updatePlayButton(false);

      gamePlayerTitle.textContent = "Coming soon";
      gamePlayerFrame.replaceChildren();

      const message = document.createElement("div");
      message.className = "coming-soon-message";
      message.textContent = "Coming soon";

      gamePlayerFrame.appendChild(message);

      openTabBtn.classList.add("hidden");
      fullscreenBtn.classList.add("hidden");

      gameCatalogView.classList.add("hidden");
      gamePlayerView.classList.remove("hidden");
    }

    function closeGame() {
      gamePlayerFrame.replaceChildren();
      currentGameKey = null;

      gamePlayerView.classList.add("hidden");
      gameCatalogView.classList.remove("hidden");

      openTabBtn.classList.remove("hidden");
      fullscreenBtn.classList.remove("hidden");

      if (userWantsMusic && !document.hidden) {
        playMusic();
      }
    }

    document.getElementById("slopeGameCard")
      .addEventListener("click", () => openGame("slope"));

    document.getElementById("spaceWavesGameCard")
      .addEventListener("click", () => openGame("spaceWaves"));

    document.getElementById("grannyGameCard")
      .addEventListener("click", () => openGame("granny"));

    // Among Us now opens as a playable game instead of Coming soon.
    document.getElementById("amongUsGameCard")
      .addEventListener("click", () => openGame("amongUs"));

    document.getElementById("minecraftGameCard")
      .addEventListener("click", openComingSoon);

    document.getElementById("gameBackBtn")
      .addEventListener("click", closeGame);

    openTabBtn.addEventListener("click", () => {
      if (currentGameKey && games[currentGameKey]) {
        window.open(
          games[currentGameKey].url,
          "_blank",
          "noopener,noreferrer"
        );
      }
    });

    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await gamePlayerFrame.requestFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen could not be opened:", error);
      }
    });

    /* INITIALIZE */
    selectApp("magma");
  </script>
</body>
</html>
